[project]
name = "watchlist-streamer"
version = "0.1.0"
description = "Realtime multi-symbol watchlist streamer with strategy dispatch and alarms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "ib-async>=2.0.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "data-sources",
    "indicators",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
data-sources = { git = "https://github.com/TeroMeht/data_sources.git", branch = "main" }
indicators   = { git = "https://github.com/TeroMeht/indicators.git",   branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
